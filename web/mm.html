<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tegami · MetaMask</title>
<style>
 body{margin:0;font:17px/1.5 system-ui,sans-serif;background:#FAF4EA;color:#2A1714;display:flex;min-height:100vh;align-items:center;justify-content:center}
 .c{background:#FFFDF8;border:1px solid #e7dccd;border-radius:22px;padding:28px;max-width:420px;margin:20px;text-align:center}
 h1{font-size:24px;margin:0 0 8px} p{color:#5c4a45;word-break:break-word} .ok{color:#1E6B47;font-weight:700} .err{color:#B3261E}
 pre{text-align:left;white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;background:#f3ebe0;border-radius:12px;padding:10px;max-height:180px;overflow:auto}
 button{background:#A3161D;color:#fff;border:0;border-radius:14px;padding:14px 22px;font-size:17px;font-weight:700;margin-top:12px}
</style></head><body><div class="c">
<h1 id="t">Tegami 手紙</h1><p id="m">Opening MetaMask…</p><pre id="d" hidden></pre><button id="b" hidden>Continue</button>
</div><script>
// Runs inside MetaMask's in-app browser. It does exactly one thing the Tegami app asked for (connect, sign or send)
// and hands the result back with a tegami:// link. The app re-checks everything: signatures are verified on the
// phone and transactions are confirmed against Monad, so nothing returned here is trusted blindly.
const q = new URLSearchParams(location.search);
const T = document.getElementById("t"), M = document.getElementById("m"), D = document.getElementById("d"), B = document.getElementById("b");
const say = (t, m, cls) => { T.textContent = t; M.textContent = m; M.className = cls || ""; };
const back = (params) => {
  const u = new URLSearchParams(Object.assign({ id: q.get("id") || "" }, params));
  location.href = "intent://metamask?" + u.toString() + "#Intent;scheme=tegami;package=com.tegami;end";
};
const ready = () => new Promise(res => {
  if (window.ethereum) return res(true);
  window.addEventListener("ethereum#initialized", () => res(true), { once: true });
  let n = 0; const t = setInterval(() => { if (window.ethereum || ++n > 50) { clearInterval(t); res(!!window.ethereum); } }, 100);
});
async function monad() {
  const chainId = q.get("chain");
  try {
    await ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId }] });
  } catch (e) {
    if (e.code !== 4902 && !String(e.message).includes("Unrecognized")) throw e;
    await ethereum.request({ method: "wallet_addEthereumChain", params: [{ chainId, chainName: q.get("chainName"),
      rpcUrls: [q.get("rpc")], blockExplorerUrls: [q.get("explorer")], nativeCurrency: { name: "MON", symbol: "MON", decimals: 18 } }] });
  }
}
async function run() {
  B.hidden = true;
  const op = q.get("op");
  try {
    if (!(await ready())) { B.hidden = false; return say("Open in MetaMask", "This page has to be opened inside the MetaMask app.", "err"); }
    const [account] = await ethereum.request({ method: "eth_requestAccounts" });
    say("Switching to Monad", "Approve the network in MetaMask if it asks.");
    await monad();
    if (op === "connect" || op === "sign") {
      if (op === "sign" && account.toLowerCase() !== (q.get("from") || "").toLowerCase()) {
        return say("Wrong account", "Switch MetaMask to " + q.get("from") + " and tap Continue.", "err"), (B.hidden = false);
      }
      const msg = q.get("msg"); D.textContent = msg; D.hidden = false;
      say(op === "connect" ? "Connect to Tegami" : "Sign your income statement", "Check the text, then approve in MetaMask.");
      const sig = await ethereum.request({ method: "personal_sign", params: [msg, account] });
      say("Signed ✓", "Returning to Tegami…", "ok");
      setTimeout(() => back({ address: account, sig }), 400);
    } else if (op === "send") {
      if (account.toLowerCase() !== (q.get("from") || "").toLowerCase()) {
        return say("Wrong account", "Switch MetaMask to " + q.get("from") + " and tap Continue.", "err"), (B.hidden = false);
      }
      say("Approve in MetaMask", q.get("label") || "Approve the transaction.");
      const hash = await ethereum.request({ method: "eth_sendTransaction", params: [{ from: account, to: q.get("to"), data: q.get("data"), value: "0x0" }] });
      say("Sent ✓", "Returning to Tegami…", "ok");
      setTimeout(() => back({ address: account, hash }), 400);
    } else {
      say("Unknown request", "Go back to Tegami and try again.", "err");
    }
  } catch (e) {
    say("Not done", (e && e.message) || String(e), "err");
    B.textContent = "Back to Tegami"; B.hidden = false; B.onclick = () => back({ error: (e && e.message) || "cancelled" });
  }
}
B.onclick = run; ready().then(ok => ok ? run() : (B.hidden = false, say("Tap Continue", "Tap Continue to connect MetaMask.")));
</script></body></html>
