# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Tegami's letters on Monad testnet: every TegamiSeal `Sealed` payment and `PayerSet` registry change.
# The app reads this for speed (one query per page); income statements are still verified against the chain.
name: tegami-indexer
description: Sealed payment letters and the payer registry of TegamiSeal on Monad testnet
contracts:
  - name: TegamiSeal
    abi_file_path: ./abis/TegamiSeal.json
    events:
      - event: PayerSet(address indexed payer, string name)
      - event: Sealed(address indexed to, uint256 indexed index, address indexed payer, address token, uint256 amount, string invoice)
chains:
  - id: 10143 # Monad testnet
    start_block: 70739528 # TegamiSeal deployment
    contracts:
      - name: TegamiSeal
        address: "0x74b4413B3f8433Ec62469Edd03099a4CFE87fFD8"
    rpc:
      - url: ${ENVIO_MONAD_RPC_URL:-https://testnet-rpc.monad.xyz}
        for: fallback
